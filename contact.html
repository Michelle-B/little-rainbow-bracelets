  <!-- Contact form -->
<form class="contact-form">

  <div>
    <label for="voornaam">Voornaam</label>
    <input type="text" id="voornaam" name="voornaam" required>
  </div>

  <div>
    <label for="achternaam">Achternaam</label>
    <input type="text" id="achternaam" name="achternaam" required>
  </div>

  <div>
    <label for="adres">Adres</label>
    <input type="text" id="adres" name="adres" required>
  </div>

  <div>
    <label for="postcode">Postcode</label>
    <input type="text" id="postcode" name="postcode" placeholder="1234 AB" pattern="[0-9]{4}\s?[A-Za-z]{2}" required>
  </div>

  <div>
    <label for="woonplaats">Woonplaats</label>
    <input type="text" id="woonplaats" name="woonplaats" required>
  </div>

  <div>
    <label for="telefoon">Telefoonnummer</label>
    <input type="tel" id="telefoon" name="telefoon" placeholder="06 12345678" pattern="[0-9\s+\-]{10,15}" required>
  </div>

  <div>
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" placeholder="your@email.com" required>
  </div>

  <div>
    <input type="file" name="photos" accept="image/*" multiple>
  </div>

  <label for="feedback">Bericht</label><br>
    <textarea id="feedback" name="feedback"></textarea>
    <br><br>

  <button type="submit">Verzenden</button>
  <input type="reset" value="Reset">
</form>
